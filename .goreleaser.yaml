# Release builds for rootwalk: `git tag vX.Y.Z && git push --tags` runs this
# through .github/workflows/release.yml.
version: 2

project_name: rootwalk

builds:
  - main: ./cmd/rootwalk
    binary: rootwalk
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  footer: |
    Install:

    ```
    curl -fsSL https://raw.githubusercontent.com/Rakshit-gen/rootwalk/main/scripts/install.sh | sh
    ```
